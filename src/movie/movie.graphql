type Query {
    movies(_director: String, _title: String, _min_rating: Float): [Movie!]!
    movie_with_id(_id: String!): Movie
}

type Mutation {
    create_movie(_title: String!, _director: String!, _rating: Float!): Movie
    update_movie(_id: String!, _title: String, _director: String, _rating: Float): Movie
    delete_movie(_id: String!): Movie
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor!]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}