services:
  movie:
    build:
      dockerfile: Dockerfile.movie
    ports:
      - "3001:3001"
    depends_on:
      - mongo
  booking:
    build:
      dockerfile: Dockerfile.booking
    ports:
      - "3201:3201"
  schedule:
    build:
      dockerfile: Dockerfile.schedule
    ports:
      - "3202:3202"
    depends_on:
      - mongo
  user:
    build:
      dockerfile: Dockerfile.user
    ports:
      - "3203:3203"

  mongo:
      image: docker.io/mongo:latest
      container_name: mongo
      restart: always
      ports:
        - "27017:27017"
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: example
      volumes:
        - mongo_data:/data/db

  mongo-express:
    image: docker.io/mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:

